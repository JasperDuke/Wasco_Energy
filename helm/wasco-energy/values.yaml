nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

openshift:
  enabled: false
  route:
    enabled: false
    tls:
      enabled: false
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

frontend:
  replicaCount: 1
  image:
    repository: registry.gitlab.com/brillar/atenxion-bank/wasco-energy-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  replicaCount: 1
  image:
    repository: registry.gitlab.com/brillar/atenxion-bank/wasco-energy-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4014
  env:
    nodeEnv: production
    jwtExpiresIn: 7d
    uploadDir: uploads
    # Leave empty to derive from ingress.host when ingress is enabled.
    clientUrl: ""
    corsOrigin: ""
    apiPublicUrl: ""
  secret:
    # For production, replace this value or use existingSecret.
    jwtSecret: "change-me"
    existingSecret: ""
    jwtSecretKey: JWT_SECRET
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  waitForMongo:
    enabled: true
    image: busybox:1.36
  resources: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: latest
    pullPolicy: IfNotPresent
  database: wasco-vendor-portal
  service:
    port: 27017
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalMongodb:
  # Used when mongodb.enabled=false.
  uri: ""
  existingSecret: ""
  uriKey: MONGODB_URI

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: wasco-energy.local
  tls:
    enabled: false
    secretName: ""

route:
  enabled: false
  annotations: {}
  # Set this to a hostname under your OpenShift apps domain.
  host: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  paths:
    frontend: /
    api: /api
    uploads: /uploads
